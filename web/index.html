<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DailyMeds — Medication Tracker for iPhone</title>
  <meta name="description" content="DailyMeds is a free medication reminder app for iPhone. No account, no subscription, no tracking." />
  <meta property="og:title" content="DailyMeds" />
  <meta property="og:description" content="Free medication reminders for iPhone. Private, no account." />
  <meta property="og:type" content="website" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0e0e0e;
      color: #fff;
      overflow-x: hidden;
    }

    /* ── Layout ───────────────────────────── */
    .page {
      min-height: 100dvh;
      display: grid;
      grid-template-rows: auto 1fr auto;
    }

    /* ── Nav ──────────────────────────────── */
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 28px 48px;
      position: relative;
      z-index: 10;
    }

    .wordmark {
      font-size: 1rem;
      font-weight: 700;
      color: #fff;
      text-decoration: none;
      letter-spacing: -0.01em;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-icon {
      width: 28px;
      height: 28px;
      background: linear-gradient(to bottom, rgb(255,71,88), rgb(220,29,50));
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(220,29,50,0.4);
    }
    
    .logo-icon img {
      width: 18px;
      height: 18px;
    }

    .nav-links { display: flex; gap: 28px; list-style: none; }

    .nav-links a {
      font-size: 0.82rem;
      color: rgba(255,255,255,0.45);
      text-decoration: none;
      transition: color 0.2s;
    }

    .nav-links a:hover { color: #fff; }

    /* ── Hero ─────────────────────────────── */
    .hero {
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: center;
      padding: 0 48px;
      gap: 48px;
    }

    .hero-text { max-width: 460px; }

    .hero-text h1 {
      font-size: clamp(2.6rem, 5.5vw, 4.2rem);
      font-weight: 800;
      line-height: 1.05;
      letter-spacing: -0.04em;
      margin-bottom: 28px;
      color: #fff;
    }

    .hero-text h1 em {
      font-style: normal;
      color: rgba(255,255,255,0.35);
    }

    .store-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: #fff;
      color: #0e0e0e;
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: 700;
      padding: 13px 22px;
      border-radius: 100px;
      letter-spacing: -0.01em;
      transition: opacity 0.2s;
    }

    .store-btn:hover { opacity: 0.85; }
    .store-btn svg { flex-shrink: 0; }

    /* ── Screenshot ───────────────────────── */
    .hero-visual {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      padding-top: 16px;
    }

    .app-screenshot {
      max-height: 580px;
      width: auto;
      display: block;
      filter: drop-shadow(0 32px 64px rgba(0,0,0,0.7));
    }

    /* ── Footer ───────────────────────────── */
    footer {
      padding: 28px 48px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.78rem;
      color: rgba(255,255,255,0.2);
    }

    footer a { color: rgba(255,255,255,0.2); text-decoration: none; transition: color 0.2s; }
    footer a:hover { color: rgba(255,255,255,0.7); }
    footer .links { display: flex; gap: 24px; }

    /* ── Mobile ───────────────────────────── */
    @media (max-width: 640px) {
      nav    { padding: 24px 24px; }
      footer { padding: 24px 24px; flex-direction: column; gap: 12px; text-align: center; }

      .hero {
        grid-template-columns: 1fr;
        padding: 32px 24px 0;
        text-align: center;
        gap: 32px;
      }

      .hero-text { max-width: 100%; }

      .hero-visual { justify-content: center; }

      .app-screenshot { max-height: 420px; }
    }
  </style>
</head>
<body>

<div class="page">

  <nav>
    <a class="wordmark" href="/">
      <div class="logo-icon"><img src="/logo.png" alt="" /></div>
      DailyMeds
    </a>
    <ul class="nav-links">
      <li><a href="/support/">Support</a></li>
      <li><a href="/privacy/">Privacy</a></li>
    </ul>
  </nav>

  <section class="hero">

    <div class="hero-text">
      <h1>Stay on track <em>with your</em> health.</h1>
      <!-- Replace href with your real App Store ID once live -->
      <a class="store-btn" href="https://apps.apple.com/app/idXXXXXXXXXX" target="_blank" rel="noopener">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="currentColor">
          <path d="M11.182 0c.096.981-.27 1.98-.902 2.699-.63.714-1.638 1.27-2.64 1.197-.12-.98.338-1.99.923-2.65C9.157.572 10.226.05 11.182 0zM8.006 4.222c.73 0 2.087-.997 3.862-.997.607 0 2.387.176 3.516 1.793l-.057.038c-.307.202-1.16.83-1.16 2.347 0 1.888 1.155 2.553 1.48 2.749l.092.056c-.072.203-.46 1.41-1.361 2.644-.794 1.107-1.62 2.148-2.813 2.148-1.136 0-1.51-.68-2.82-.68-1.278 0-1.761.7-2.775.7-1.102 0-1.965-.993-2.842-2.175C1.72 10.783 1 8.998 1 7.3c0-2.885 1.878-4.412 3.726-4.412.955 0 1.907.546 2.527.546.584 0 1.533-.632 2.628-.632l-.875.42z"/>
        </svg>
        Download on the App Store
      </a>
    </div>

    <div class="hero-visual">
      <img
        class="app-screenshot"
        src="/screenshot.png"
        alt="DailyMeds app showing today's medication schedule with Amoxicillin due and dose logging buttons"
        width="473"
        height="966"
      />
    </div>

  </section>

  <footer>
    <span>© 2026 figoodle</span>
    <div class="links">
      <a href="/support/">Support</a>
      <a href="/privacy/">Privacy</a>
    </div>
  </footer>

</div>

</body>
</html>
