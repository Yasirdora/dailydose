<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DailyMeds — Medication Tracker for iPhone</title>
  <meta name="description" content="DailyMeds is a free medication reminder app for iPhone. No account, no subscription, no tracking." />
  <meta property="og:title" content="DailyMeds" />
  <meta property="og:description" content="Free medication reminders for iPhone. Private, no account." />
  <meta property="og:type" content="website" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0e0e0e;
      color: #fff;
      overflow-x: hidden;
    }

    /* ── Layout shell ─────────────────────── */
    .page {
      min-height: 100dvh;
      display: grid;
      grid-template-rows: auto 1fr auto;
    }

    /* ── Nav ─────────────────────────────── */
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 28px 48px;
      position: relative;
      z-index: 10;
    }

    .wordmark {
      font-size: 1rem;
      font-weight: 700;
      color: #fff;
      text-decoration: none;
      letter-spacing: -0.01em;
    }

    .nav-links {
      display: flex;
      gap: 28px;
      list-style: none;
    }

    .nav-links a {
      font-size: 0.82rem;
      color: rgba(255,255,255,0.45);
      text-decoration: none;
      letter-spacing: 0.01em;
      transition: color 0.2s;
    }

    .nav-links a:hover { color: #fff; }

    /* ── Hero ─────────────────────────────── */
    .hero {
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: center;
      padding: 0 48px;
      gap: 40px;
    }

    /* Left ── text */
    .hero-text { max-width: 480px; }

    .hero-text h1 {
      font-size: clamp(2.6rem, 5.5vw, 4.2rem);
      font-weight: 800;
      line-height: 1.05;
      letter-spacing: -0.04em;
      margin-bottom: 28px;
      color: #fff;
    }

    .hero-text h1 em {
      font-style: normal;
      color: rgba(255,255,255,0.35);
    }

    .store-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: #fff;
      color: #0e0e0e;
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: 700;
      padding: 13px 22px;
      border-radius: 100px;
      letter-spacing: -0.01em;
      transition: opacity 0.2s;
    }

    .store-btn:hover { opacity: 0.85; }

    .store-btn svg { flex-shrink: 0; }

    /* Right ── phone mockup */
    .hero-visual {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      padding-top: 40px;
    }

    .phone {
      width: 220px;
      height: 440px;
      background: #1a1a1a;
      border-radius: 36px;
      border: 1.5px solid rgba(255,255,255,0.1);
      position: relative;
      overflow: hidden;
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.05),
        0 40px 80px rgba(0,0,0,0.6);
    }

    /* Dynamic island */
    .phone::before {
      content: '';
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      width: 80px;
      height: 26px;
      background: #0e0e0e;
      border-radius: 20px;
      z-index: 2;
    }

    /* Screen content */
    .phone-screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      padding: 60px 22px 24px;
    }

    .phone-time {
      font-size: 0.65rem;
      color: rgba(255,255,255,0.3);
      margin-bottom: 28px;
      text-align: center;
    }

    .phone-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 0;
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }

    .phone-row:last-child { border-bottom: none; }

    .pill-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .pill-label {
      font-size: 0.7rem;
      color: rgba(255,255,255,0.7);
      flex: 1;
    }

    .pill-time {
      font-size: 0.62rem;
      color: rgba(255,255,255,0.25);
    }

    .pill-check {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 1.5px solid rgba(255,255,255,0.15);
      flex-shrink: 0;
    }

    .pill-check.done {
      background: rgba(255,255,255,0.9);
      border-color: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .pill-check.done::after {
      content: '';
      width: 5px;
      height: 3px;
      border-left: 1.5px solid #0e0e0e;
      border-bottom: 1.5px solid #0e0e0e;
      transform: rotate(-45deg) translate(0.5px, -0.5px);
      display: block;
    }

    .phone-label {
      font-size: 0.58rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: rgba(255,255,255,0.2);
      margin-bottom: 10px;
      margin-top: 14px;
    }

    /* ── Footer ─────────────────────────── */
    footer {
      padding: 28px 48px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.78rem;
      color: rgba(255,255,255,0.2);
    }

    footer a {
      color: rgba(255,255,255,0.2);
      text-decoration: none;
      transition: color 0.2s;
    }

    footer a:hover { color: rgba(255,255,255,0.7); }

    footer .links { display: flex; gap: 24px; }

    /* ── Mobile ─────────────────────────── */
    @media (max-width: 640px) {
      nav    { padding: 24px 24px; }
      footer { padding: 24px 24px; flex-direction: column; gap: 12px; text-align: center; }

      .hero {
        grid-template-columns: 1fr;
        padding: 40px 24px 0;
        text-align: center;
      }

      .hero-text { max-width: 100%; }

      .hero-visual {
        justify-content: center;
        padding-top: 20px;
        overflow: hidden;
      }

      .phone {
        width: 180px;
        height: 360px;
      }
    }
  </style>
</head>
<body>

<div class="page">

  <nav>
    <a class="wordmark" href="/">DailyMeds</a>
    <ul class="nav-links">
      <li><a href="/support/">Support</a></li>
      <li><a href="/privacy/">Privacy</a></li>
    </ul>
  </nav>

  <section class="hero">

    <div class="hero-text">
      <h1>Stay on track <em>with your</em> health.</h1>
      <!-- Replace href with real App Store ID once live -->
      <a class="store-btn" href="https://apps.apple.com/app/idXXXXXXXXXX" target="_blank" rel="noopener">

        </svg>
        Download on the App Store
      </a>
    </div>

    <div class="hero-visual">
      <div class="phone">
        <div class="phone-screen">
          <p class="phone-time">9:41</p>

          <p class="phone-label">Today</p>

          <div class="phone-row">
            <div class="pill-dot" style="background:#6eaed6;"></div>
            <span class="pill-label">Lisinopril 10mg</span>
            <span class="pill-time">8:00</span>
            <div class="pill-check done"></div>
          </div>

          <div class="phone-row">
            <div class="pill-dot" style="background:#a8c5a0;"></div>
            <span class="pill-label">Vitamin D</span>
            <span class="pill-time">8:00</span>
            <div class="pill-check done"></div>
          </div>

          <div class="phone-row">
            <div class="pill-dot" style="background:#e0a87c;"></div>
            <span class="pill-label">Metformin 500mg</span>
            <span class="pill-time">1:00 PM</span>
            <div class="pill-check"></div>
          </div>

          <div class="phone-row">
            <div class="pill-dot" style="background:#c49bcf;"></div>
            <span class="pill-label">Omeprazole</span>
            <span class="pill-time">8:00 PM</span>
            <div class="pill-check"></div>
          </div>

          <p class="phone-label" style="margin-top:18px;">Upcoming</p>

          <div class="phone-row">
            <div class="pill-dot" style="background:#e0a87c;"></div>
            <span class="pill-label">Metformin 500mg</span>
            <span class="pill-time">7:00 PM</span>
            <div class="pill-check"></div>
          </div>
        </div>
      </div>
    </div>

  </section>

  <footer>
    <span>© 2026 figoodle</span>
    <div class="links">
      <a href="/support/">Support</a>
      <a href="/privacy/">Privacy</a>
    </div>
  </footer>

</div>

</body>
</html>
